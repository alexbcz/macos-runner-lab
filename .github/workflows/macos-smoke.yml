name: macOS runtime and extraction smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-macos:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - name: Prepare private test directories
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/2ship-smoke/logs" "$RUNNER_TEMP/2ship-smoke/private"

      - name: Download DMG from test repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/2ship-download"
          gh release download smoke-input \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '2Ship.dmg' \
            --dir "$RUNNER_TEMP/2ship-download" \
            --clobber
          test -s "$RUNNER_TEMP/2ship-download/2Ship.dmg"

      - name: Download test ROM privately
        shell: bash
        env:
          ROM_URL: ${{ secrets.PAL_ROM_URL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${ROM_URL:-}" ]]; then
            echo '::error::Configure the repository secret PAL_ROM_URL with the tmpfiles.org landing-page URL.'
            exit 1
          fi

          ROM="$RUNNER_TEMP/2ship-smoke/private/n64_eu.z64"
          DOWNLOAD_URL="$ROM_URL"

          # tmpfiles.org landing pages return HTML; resolve their current /dl/ href.
          # Do not print either the landing URL or the temporary direct URL in logs.
          if [[ "$ROM_URL" =~ ^https?://(www\.)?tmpfiles\.org/ ]] && \
             [[ ! "$ROM_URL" =~ ^https?://(www\.)?tmpfiles\.org/dl/ ]]; then
            PAGE="$RUNNER_TEMP/2ship-smoke/private/tmpfiles-landing.html"
            curl --fail --location --silent --show-error --retry 2 \
              --connect-timeout 20 --max-time 45 \
              --output "$PAGE" "$ROM_URL"

            DOWNLOAD_URL="$(python3 - "$PAGE" "$ROM_URL" <<'PYEXTRACT'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit, unquote
          import sys

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.urls.extend(value for key, value in attrs if key == 'href' and value)

          page = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          landing_url = sys.argv[2]
          filename = unquote(urlsplit(landing_url).path.rsplit('/', 1)[-1])
          links = LinkParser()
          links.feed(page)

          for href in links.urls:
              candidate = urlsplit(urljoin(landing_url, href))
              if (candidate.hostname in ('tmpfiles.org', 'www.tmpfiles.org')
                      and candidate.path.startswith('/dl/')
                      and unquote(candidate.path.rsplit('/', 1)[-1]) == filename):
                  # Upgrade HTTP download links embedded in the page to HTTPS.
                  print(urlunsplit(('https', candidate.netloc, candidate.path, candidate.query, '')))
                  break
          else:
              raise SystemExit('Unable to find a download link on the tmpfiles.org page; the upload may have expired.')
          PYEXTRACT
            )"
          fi

          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 240 \
            --referer "$ROM_URL" \
            --output "$ROM" "$DOWNLOAD_URL"

          # Reject an HTML landing/error page even if the host returned HTTP 200.
          python3 - "$ROM" <<'PYVALIDATE'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          size = p.stat().st_size
          with p.open('rb') as f:
              magic = f.read(4)
          if not (16 * 1024 * 1024 <= size <= 64 * 1024 * 1024):
              raise SystemExit(f'Unexpected ROM size: {size} bytes (download may be an error page)')
          if magic != bytes.fromhex('80371240'):
              raise SystemExit(f'Unexpected .z64 ROM header: {magic.hex()} (not a big-endian N64 ROM)')
          print(f'Download OK: big-endian N64 ROM, {size} bytes')
          PYVALIDATE

          echo "SMOKE_ROM=$ROM" >> "$GITHUB_ENV"

      - name: Mount DMG and prepare application
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/2ship-smoke"
          DMG="$RUNNER_TEMP/2ship-download/2Ship.dmg"
          MOUNT="$ROOT/mount"
          mkdir -p "$MOUNT" "$ROOT/app"

          hdiutil verify "$DMG"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT

          APP_SOURCE="$(find "$MOUNT" -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_SOURCE" ]]; then
            echo '::error::No .app bundle found in DMG.'
            exit 1
          fi
          APP="$ROOT/app/$(basename "$APP_SOURCE")"
          ditto "$APP_SOURCE" "$APP"
          plutil -lint "$APP/Contents/Info.plist"

          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          BIN="$APP/Contents/MacOS/$EXEC_NAME"
          test -x "$BIN"
          file "$BIN"
          lipo -archs "$BIN"
          echo "SMOKE_BINARY=$BIN" >> "$GITHUB_ENV"

      - name: Execute ROM extraction and start game
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/2ship-smoke"
          LOGS="$ROOT/logs"
          mkdir -p "$ROOT/user-data"
          export SHIP_HOME="$ROOT/user-data"

          # exec makes the tracked PID the actual 2s2h process; correct cwd
          # also permits SDL to find gamecontrollerdb.txt.
          (
            cd "$(dirname "$SMOKE_BINARY")"
            exec "$SMOKE_BINARY" "$SMOKE_ROM"
          ) > "$LOGS/game.log" 2>&1 &
          GAME_PID=$!

          STOP_REASON=timeout_300s
          STOPPED_BY_TEST=1
          ENGINE_AT=0
          SECOND=0

          # Extraction can take longer than the no-ROM smoke test.
          # Allow time for the full automatic sequence observed on Linux.
          # Stop after 180 seconds of engine runtime, or after 300 seconds total.
          for ((SECOND=1; SECOND<=300; SECOND++)); do
            if ! kill -0 "$GAME_PID" 2>/dev/null; then
              STOPPED_BY_TEST=0
              STOP_REASON=process_exited
              break
            fi
            if (( ENGINE_AT == 0 )) && grep -Fq 'Starting 2 Ship 2 Harkinian' "$LOGS/game.log"; then
              ENGINE_AT=$SECOND
              echo "Engine initialization observed after approximately ${SECOND}s"
            fi
            if (( ENGINE_AT > 0 && SECOND - ENGINE_AT >= 180 )); then
              STOP_REASON=engine_stable_180s
              break
            fi
            sleep 1
          done

          if (( STOPPED_BY_TEST == 1 )); then
            kill -TERM "$GAME_PID" 2>/dev/null || true
            sleep 3
            if kill -0 "$GAME_PID" 2>/dev/null; then
              kill -KILL "$GAME_PID" 2>/dev/null || true
            fi
          fi

          set +e
          wait "$GAME_PID"
          EXIT_CODE=$?
          set -e

          # The application writes mm.o2r to its app-data directory.
          MM_O2R="$(find "$HOME/Library/Application Support" "$ROOT" \
            -type f -name mm.o2r -print -quit 2>/dev/null || true)"
          ARCHIVE_OK=no
          if [[ -n "$MM_O2R" && -s "$MM_O2R" ]]; then
            if unzip -tqq "$MM_O2R" > "$LOGS/archive-check.log" 2>&1; then
              ARCHIVE_OK=yes
            fi
          fi

          ENGINE_OK=no
          if grep -Fq 'Starting 2 Ship 2 Harkinian' "$LOGS/game.log"; then
            ENGINE_OK=yes
          fi

          SCENE_LOG_COUNT="$(grep -Eic 'entrance:|loading scene|load scene|scene [0-9]+|cutscene' "$LOGS/game.log" || true)"

          # Check the same ordered, already-existing log markers observed on Linux.
          # This examines the release binary's output; it does not modify that binary.
          if python3 - "$LOGS/game.log" > "$LOGS/scene-sequence.txt" <<'PYSCENES'
          import re
          import sys
          from pathlib import Path

          log = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          pattern = re.compile(
              r'Cutscene_HandleConditionalTriggers:\s*entrance:\s*(\d+),\s*cutsceneIndex:\s*(0x[0-9A-Fa-f]+)'
          )
          observed = [(int(m.group(1)), int(m.group(2), 16)) for m in pattern.finditer(log)]
          expected = [(7168, 0xFFFA), (55296, 0xFFF2), (48128, 0xFFF0)]

          print('Observed cutscene/entrance events:')
          for entrance, cutscene in observed:
              print(f'entrance={entrance} cutsceneIndex=0x{cutscene:04X}')

          i = 0
          for item in observed:
              if i < len(expected) and item == expected[i]:
                  i += 1
          print(f'Expected ordered sequence: {i}/{len(expected)} events matched')
          sys.exit(0 if i == len(expected) else 1)
          PYSCENES
          then
            SCENE_SEQUENCE_OK=yes
          else
            SCENE_SEQUENCE_OK=no
          fi
          {
            echo "stop_reason=$STOP_REASON"
            echo "elapsed_seconds=$SECOND"
            echo "exit_code=$EXIT_CODE"
            echo "stopped_by_test=$STOPPED_BY_TEST"
            echo "mm_o2r_found=$([[ -n "$MM_O2R" ]] && echo yes || echo no)"
            echo "mm_o2r_zip_valid=$ARCHIVE_OK"
            if [[ -n "$MM_O2R" ]]; then
              echo "mm_o2r_size_bytes=$(stat -f%z "$MM_O2R")"
            fi
            echo "engine_initialized=$ENGINE_OK"
            echo "potential_scene_log_lines=$SCENE_LOG_COUNT"
            echo "expected_scene_sequence_reached=$SCENE_SEQUENCE_OK"
          } > "$LOGS/summary.txt"

          /usr/bin/log show --last 7m --style compact \
            --predicate 'process == "2s2h"' \
            > "$LOGS/macos-unified.log" 2>&1 || true

          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          if [[ -d "$CRASH_DIR" ]]; then
            mkdir -p "$LOGS/crash-reports"
            find "$CRASH_DIR" -maxdepth 1 -type f \
              \( -iname '*2s2h*' -o -iname '*2ship*' \) \
              -mmin -10 -exec cp {} "$LOGS/crash-reports/" \; || true
          fi

          echo '=== SUMMARY ==='
          cat "$LOGS/summary.txt"
          echo '=== GAME LOG (last 100 lines) ==='
          tail -n 100 "$LOGS/game.log" || true

          # Never upload the downloaded ROM or the generated mm.o2r.
          if [[ "$ARCHIVE_OK" != yes ]]; then
            echo '::error::mm.o2r was not generated or is not a valid ZIP/O2R archive.'
            exit 1
          fi
          if [[ "$ENGINE_OK" != yes ]]; then
            echo '::error::Game engine initialization was not observed.'
            exit 1
          fi
          if [[ "$STOP_REASON" != engine_stable_180s ]]; then
            echo '::error::Game did not stay alive for 180 seconds after engine initialization.'
            exit 1
          fi
          if [[ "$SCENE_SEQUENCE_OK" != yes ]]; then
            echo '::error::The 3 expected entrance/cutscene events were not observed in order. See scene-sequence.txt.'
            exit 1
          fi
          echo '::notice::ROM extracted; game engine stayed alive for 180 seconds and reached all 3 expected entrance markers.'

      - name: Upload diagnostics (logs only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-runtime-logs
          path: ${{ runner.temp }}/2ship-smoke/logs
          retention-days: 3
          if-no-files-found: warn
